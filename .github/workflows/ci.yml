name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm lint
      - name: Prettier
        run: pnpm prettier
      - name: TypeScript
        run: pnpm typecheck
      - name: Fail-closed release gate policy unit tests
        run: node --test scripts/release-gates.test.mjs scripts/b2b-preflight.test.mjs scripts/b2b-results.test.mjs scripts/b2b-pair.test.mjs
      - name: Playwright test discovery (no live production traffic)
        run: pnpm exec playwright test --list
      - name: Discover isolated B2B negative E2E without contacting preview
        env:
          RUN_B2B_E2E: '1'
          E2E_BASE_URL: https://isolated-preview.example
        run: pnpm exec playwright test --project=b2b-isolation-chromium --list
      - name: Discover two-QA real login project without contacting preview
        env:
          RUN_TWO_QA_E2E: '1'
          E2E_BASE_URL: https://isolated-preview.example
        run: pnpm exec playwright test --project=two-qa-company-chromium --list
